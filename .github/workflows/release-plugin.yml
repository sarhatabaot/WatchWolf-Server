name: Release WatchWolf-Server plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Java 8 plugin JAR
        run: ./gradlew --no-daemon clean assemble
      - name: Check release tag against artifact version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          version="${RELEASE_TAG#v}"
          test -s "build/libs/WatchWolf-${version}-1.8-LATEST.jar"
      - name: Create plugin release with JAR and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          artifact="WatchWolf-${version}-1.8-LATEST.jar"
          (cd build/libs && sha256sum "$artifact" > "$artifact.sha256")
          gh release create "$RELEASE_TAG" "build/libs/$artifact" "build/libs/$artifact.sha256" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
