name: Release WatchWolf-Server plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Java 8 plugin JAR
        run: ./gradlew --no-daemon clean assemble
      - name: Check release tag against artifact version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          version="${RELEASE_TAG#v}"
          test -s "build/libs/WatchWolf-${version}-1.8-LATEST.jar"
      - name: Upload plugin JAR and checksum to published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          artifact="WatchWolf-${version}-1.8-LATEST.jar"
          (cd build/libs && sha256sum "$artifact" > "$artifact.sha256")
          gh release upload "$RELEASE_TAG" "build/libs/$artifact" "build/libs/$artifact.sha256"
